plugins {
    id 'groovy'
    id 'java-library'
    id 'application'
    id 'maven-publish'
}

description = 'Language Server completing Groovy DSLs written with @DelegatesTo'
ext.pomName = 'Groovy CAD DSL LSP Server'

repositories {
    mavenCentral()
}

java {
    // Grails 7 apps run on Java 17 and later
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

dependencies {
    // The Groovy of Grails 7; the engine uses the compiler of the application it runs in
    api 'org.apache.groovy:groovy:4.0.33'
    api 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.24.0'

    testImplementation 'org.apache.groovy:groovy-json:4.0.33'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.taack.lsp.groovy.GroovyLanguageServerLauncher'
}

test {
    useJUnitPlatform()
    // Optional test against the CAD DSL jar of ../cad-builder, skipped when it is missing
    systemProperty 'cadDslJar', findProperty('cadDslJar') ?: file('../cad-builder/cad-dsl/build/libs/cad-dsl-0.5_SNAPSHOT.jar').path
}

apply from: "$rootDir/gradle/publishing.gradle"
