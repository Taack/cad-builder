import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    id 'cpp-library'
    id 'cpp-unit-test'
}

group = 'org.taack'
version = '0.1'

// OCCT 8.0 install prefix: -PocctHome=<dir>, the OCCT_HOME environment variable, or the platform default.
def isMac = Os.isFamily(Os.FAMILY_MAC)
def occtHome = (findProperty('occtHome') ?: System.getenv('OCCT_HOME') ?: (isMac ? '/opt/homebrew' : '/usr')) as String
ext.occtLib = "$occtHome/lib"
def occtInclude = "$occtHome/include/opencascade"

// Link every toolkit the install provides: the set varies between releases and build options
// (e.g. TKDEGLTF is only built when RapidJSON is available).
def occtToolkits = ((file(occtLib).listFiles() ?: []) as List<File>)
        .collect { it.name =~ /^lib(TK\w+)\.(so|dylib)$/ }
        .findAll { it.matches() }
        .collect { it.group(1) }
        .sort()
if (occtToolkits.empty) {
    logger.warn("No OCCT toolkits found in $occtLib, set -PocctHome or OCCT_HOME to an OCCT 8.0 install prefix")
}

def otherLibs = isMac ? ["X11", "xcb", "Xau", "Xdmcp"] : ["GL", "GLU", "GLX", "GLEW", "X11", "xcb", "Xau", "Xdmcp"]

def linkerLibs = (occtToolkits + otherLibs).collect { "-l$it" }
if (isMac) {
    linkerLibs << "-framework"
    linkerLibs << "OpenGL"
}

logger.info("OCCT: $occtHome, linkerLibs: ${linkerLibs.join(' ')}")

library {
    linkage = [Linkage.SHARED]
    //targetMachines = [
    //        machines.linux.x86_64, machines.os
    //]
}

//ext.nativeLibDir = file(projectDir.path + "build/lib/main/release/")

tasks.withType(CppCompile).configureEach {
    optimized = false
    includes.from occtInclude
    compilerArgs.add '-std=c++17'
}

tasks.withType(LinkSharedLibrary).configureEach {
    // Define toolchain-specific compiler and linker options
    linkerArgs = ["-Xlinker", "-S", "-Bdirect", "-L$occtLib", "-Wl,-rpath,$occtLib"] + linkerLibs
}

tasks.withType(LinkExecutable).configureEach {
    // Define toolchain-specific compiler and linker options
    linkerArgs = ["-Xlinker", "-S", "-Bdirect", "-L$occtLib", "-Wl,-rpath,$occtLib"] + linkerLibs
}

tasks.register('listSymsPerLib') {
    doLast {
        occtToolkits.each { libName ->
            println "nm -gDC $occtLib/lib${libName}.${isMac ? 'dylib' : 'so'}"
        }
    }
}
