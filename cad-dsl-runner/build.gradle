plugins {
    id 'groovy'
    id 'application'
}

description = 'Runs CAD DSL scripts on request, for an IDE'

// cad-dsl-native is loaded from java.library.path; it finds OCCT through its rpath (see docs/building.adoc, Native Library)
def nativeLibDir = file("$rootDir/cad-dsl-native/build/lib/main/release").absolutePath

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of 25
    }
}

dependencies {
    implementation project(':cad-dsl')
    implementation 'org.apache.groovy:groovy-json:6.0.0'
    runtimeOnly project(':cad-dsl-occt')
    testImplementation testFixtures(project(':cad-dsl'))
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// cad-dsl-runner <port>: ./gradlew :cad-dsl-runner:installDist, then build/install/cad-dsl-runner/bin/cad-dsl-runner
application {
    mainClass = 'org.taack.cad.runner.CadRunner'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

// Windows has no rpath: the OCCT DLLs that cad-dsl-native.dll links are found through PATH only. A distribution ships
// them in native, beside it. The endlocal of the launcher drops any PATH set before, so it is set on the java line.
tasks.named('startScripts', CreateStartScripts) {
    doLast {
        String script = windowsScript.text
        String withPath = script.replace('endlocal & "%JAVA_EXE%"',
                'endlocal & set "PATH=%APP_HOME%\\native;%PATH%" & "%JAVA_EXE%"')
        if (withPath == script) throw new GradleException("No java command line in $windowsScript")
        windowsScript.text = withPath
    }
}

tasks.named('run', JavaExec) {
    dependsOn ':cad-dsl-native:linkRelease'
    systemProperty 'java.library.path', nativeLibDir
}

test {
    dependsOn ':cad-dsl-native:linkRelease'
    systemProperty 'java.library.path', nativeLibDir
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    useJUnitPlatform()
}
