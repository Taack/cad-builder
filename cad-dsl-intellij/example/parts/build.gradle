// Parts shared as a jar: ./gradlew -p parts publishToMavenLocal from the example project, which uses them in its scripts
plugins {
    id 'groovy'
    id 'java-library'
    id 'maven-publish'
}

group = 'org.example.cad'
version = '0.1'

repositories {
    // cad-dsl, published from cad-builder with ./gradlew :cad-dsl:publishToMavenLocal
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of 25
    }
}

dependencies {
    // the parts are built with the DSL: the runner brings its own cad-dsl, which must be the same version
    cadImplementation 'org.taack:cad-dsl:0.3'
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
