plugins {
    id 'groovy'
    id 'java-library'
    id 'java-test-fixtures'
    id 'maven-publish'
}

description = 'DSL for CAD Bodies and Assemblies'
ext.pomName = 'Groovy CAD DSL'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of 25
    }
}

dependencies {
    // Closures and @DelegatesTo are part of the DSL API
    api 'org.apache.groovy:groovy:6.0.0'
    // The DSL tests (src/testFixtures), run by each kernel module with its kernel, see gradle/kernel-tests.gradle
    testFixturesImplementation platform('org.junit:junit-bom:6.0.3')
    testFixturesImplementation 'org.junit.jupiter:junit-jupiter'
    // to read back the glTF files
    testFixturesImplementation 'org.apache.groovy:groovy-json:6.0.0'
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// The DSL tests are not published
components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }

apply from: "$rootDir/gradle/publishing.gradle"
